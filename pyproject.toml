[project]
name = "srmist-student-portal-mcp"
version = "0.1.0"
description = "Local-first read-only MCP connector for SRMIST Student Portal"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=4.0.5,<5",
  "playwright>=1.50,<2",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
